name: Bug report
description: Something in Forca Slicer is wrong, crashes, or prints badly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please report Forca problems here, not to OrcaSlicer — even if you think the bug is Orca's.
        Check [known issues](../blob/main/docs/forca/release/KNOWN_ISSUES.md) first.
  - type: input
    id: version
    attributes:
      label: Forca version
      description: Help → About (for example 0.1.0-alpha.1)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Forca?
      options:
        - Regional support interfaces (box or paint)
        - Calibration Wizard
        - Forca AI
        - General slicing / something that also exists in OrcaSlicer
        - Install / startup / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Photos of the print or screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load ...
        2. Set ...
        3. Slice → ...
  - type: input
    id: printer
    attributes:
      label: Printer, nozzle and filament(s)
      placeholder: Bambu Lab P1S, 0.4 mm, PLA + PETG interface
    validations:
      required: true
  - type: dropdown
    id: support
    attributes:
      label: Support type (if supports are involved)
      options: ["Not using supports", "Normal (grid)", "Normal (snug)", "Tree (slim / strong / hybrid)", "Tree (organic)"]
  - type: dropdown
    id: orca
    attributes:
      label: Does the same thing happen in stock OrcaSlicer?
      options: ["Don't know / didn't try", "No, only in Forca", "Yes, also in OrcaSlicer"]
  - type: textarea
    id: files
    attributes:
      label: Project file and logs
      description: |
        Drag in the project (.3mf) if you can share the model, and the logs: Help → Troubleshoot Center →
        Stored logs → Pack… (one ForcaSlicer_Logs_….zip). Logs can include your printer's serial number, your local
        network addresses and your Windows user name — this issue is public, so check them first.
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
