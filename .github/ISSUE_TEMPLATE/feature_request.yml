name: Feature request
description: An idea for Forca Slicer.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or goal, in your own words (what you'd print, why the current way is hard).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Supports", "Calibration", "Forca AI", "Slicing in general", "Interface / usability", "Other"]
